openapi: 3.1.0
info:
  title: Personal Intelligence Layer API
  version: 0.1.0
  description: |
    REST API for PIL. Используется Admin UI и опционально внешними MCP-клиентами через REST-фасад.
    Полная семантика MCP-инструментов — docs/04-api/mcp-api.md.
servers:
  - url: https://pil.local/api/v1
    description: Self-host через reverse-proxy
  - url: http://localhost:8080/v1
    description: Локальная разработка

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /persons:
    get:
      summary: Search persons
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: topic
          schema: { type: string }
        - in: query
          name: org
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'

  /persons/{id}:
    get:
      summary: Get person card
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Person' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update person notes/topics
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Person' } }

  /persons/{id}/context:
    get:
      summary: Composed context (persona + tasks + interactions + graph + memory)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: hops, schema: { type: integer, default: 1, maximum: 3 } }
        - { in: query, name: k_memory, schema: { type: integer, default: 5, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/PersonContext' } }
        '206':
          description: Partial (один из бэкендов недоступен)
          content:
            application/json: { schema: { $ref: '#/components/schemas/PersonContext' } }

  /persons/{id}/erase:
    delete:
      summary: GDPR-каскад
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202':
          description: Accepted (async job)
          headers:
            Location: { schema: { type: string } }

  /tasks:
    get:
      summary: List tasks
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, done, dropped] } }
        - { in: query, name: due_before, schema: { type: string, format: date-time } }
        - { in: query, name: person_id, schema: { type: string, format: uuid } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/TaskList' } }

    post:
      summary: Create task manually
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaskCreate' } }
      responses:
        '201':
          description: Created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Task' } }

  /tasks/{id}:
    patch:
      summary: Update task
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaskUpdate' } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/Task' } }

  /allowlist/chats:
    get:
      summary: List chats with allowlist flag
      responses:
        '200': { description: OK }
  /allowlist/chats/{chat_id}:
    patch:
      summary: Toggle chat allowlist
      parameters: [{ in: path, name: chat_id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { allowed: { type: boolean } }
      responses:
        '200': { description: OK }

  /memory/recall:
    post:
      summary: Recall with free-form query (GraphRAG)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecallRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/RecallResponse' } }

  /system/health:
    get:
      summary: Health probe
      responses:
        '200': { description: OK }

  /system/queues:
    get:
      summary: Queue stats
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: pil_session

  responses:
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type:    { type: string }
        title:   { type: string }
        status:  { type: integer }
        detail:  { type: string }
        instance:{ type: string }

    Person:
      type: object
      properties:
        id:               { type: string, format: uuid }
        tg_user_id:       { type: integer, nullable: true }
        username:         { type: string, nullable: true }
        display_name:     { type: string }
        role:             { type: string, nullable: true }
        organizations:    { type: array, items: { type: string } }
        topics:           { type: array, items: { type: string } }
        communication_style: { type: string, nullable: true }
        trust_score:      { type: number, minimum: 0, maximum: 1 }
        last_interaction_at: { type: string, format: date-time, nullable: true }
        notes:            { type: string, nullable: true }

    PersonUpdate:
      type: object
      properties:
        notes:   { type: string }
        topics:  { type: array, items: { type: string } }
        organizations: { type: array, items: { type: string } }
        blocked: { type: boolean }

    PersonList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Person' } }
        next_cursor: { type: string, nullable: true }

    PersonContext:
      type: object
      properties:
        person: { $ref: '#/components/schemas/Person' }
        graph:
          type: object
          properties:
            neighbors: { type: array, items: { $ref: '#/components/schemas/Person' } }
            chats_in_common: { type: array, items: { type: object } }
        open_tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        recent_interactions: { type: array, items: { $ref: '#/components/schemas/Interaction' } }
        memory: { type: array, items: { $ref: '#/components/schemas/MemoryChunk' } }
        context_markdown: { type: string }
        partial_reasons: { type: array, items: { type: string }, nullable: true }

    Interaction:
      type: object
      properties:
        id:           { type: string, format: uuid }
        chat_id:      { type: string, format: uuid }
        window_start: { type: string, format: date-time }
        window_end:   { type: string, format: date-time }
        topics:       { type: array, items: { type: string } }
        sentiment:    { type: string, enum: [positive, negative, neutral, mixed] }
        summary:      { type: string }

    MemoryChunk:
      type: object
      properties:
        chunk_id: { type: string, format: uuid }
        type:     { type: string, enum: [summary, note, quote, fact] }
        text:     { type: string }
        person_ids: { type: array, items: { type: string, format: uuid } }
        chat_id:  { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        owner_person_id: { type: string, format: uuid, nullable: true }
        counterpart_person_id: { type: string, format: uuid, nullable: true }
        chat_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, done, dropped] }
        priority: { type: integer, minimum: 1, maximum: 5 }
        confidence: { type: number, minimum: 0, maximum: 1 }

    TaskCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        owner_person_id: { type: string, format: uuid }
        counterpart_person_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
        priority: { type: integer, minimum: 1, maximum: 5 }

    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, done, dropped] }
        due_at: { type: string, format: date-time }
        priority: { type: integer }

    TaskList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        next_cursor: { type: string, nullable: true }

    RecallRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        scope:
          type: object
          properties:
            person_ids: { type: array, items: { type: string, format: uuid } }
            chat_ids:   { type: array, items: { type: string, format: uuid } }
            from:       { type: string, format: date-time }
            to:         { type: string, format: date-time }
        budget:
          type: object
          properties:
            max_chunks: { type: integer, default: 8 }
            max_hops:   { type: integer, default: 2 }

    RecallResponse:
      type: object
      properties:
        answer_markdown: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [person, interaction, memory, task] }
              id:   { type: string }
              ref:  { type: string }
