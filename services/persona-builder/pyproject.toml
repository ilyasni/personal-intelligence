[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pil-contracts",
    "pil-observability",
    "pil-storage",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/persona_builder"]
