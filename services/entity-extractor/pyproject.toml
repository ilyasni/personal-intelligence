[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entity-extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pil-contracts",
    "pil-observability",
    "pil-storage",
    "spacy>=3.7",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/entity_extractor"]
