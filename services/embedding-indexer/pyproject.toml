[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedding-indexer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pil-contracts",
    "pil-observability",
    "pil-storage",
    "httpx>=0.28",
    "pydantic-settings>=2.0",
    "qdrant-client>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_indexer"]
