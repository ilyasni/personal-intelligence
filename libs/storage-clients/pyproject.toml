[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pil-storage"
version = "0.1.0"
description = "PIL storage clients: PostgreSQL (asyncpg/SQLAlchemy), Redis, S3 (aiobotocore)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "aiobotocore>=2.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pil_storage"]
