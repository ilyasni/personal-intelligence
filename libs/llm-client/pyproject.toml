[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pil-llm"
version = "0.1.0"
description = "PIL unified LLM client (Anthropic, OpenAI, Ollama)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28",
    "openai>=1.35",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pil_llm"]
