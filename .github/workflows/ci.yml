name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sanity:
    name: Install and Syntax Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            libs/**/pyproject.toml
            services/**/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: make install install-dev

      - name: Validate dependency graph
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall libs services tests

  lint-runtime:
    name: Ruff (Canonical Runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sanity

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            libs/**/pyproject.toml
            services/**/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: make install install-dev

      - name: Run Ruff for canonical runtime
        run: make lint-runtime

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - sanity
      - lint-runtime

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            libs/**/pyproject.toml
            services/**/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: make install install-dev

      - name: Run pytest
        run: |
          mkdir -p test-results
          pytest tests/ -v --junitxml=test-results/junit-${{ matrix.python-version }}.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.python-version }}
          path: test-results/junit-${{ matrix.python-version }}.xml
          if-no-files-found: error
