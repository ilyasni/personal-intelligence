name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch to deploy
        required: true
        default: main
        type: string
      confirm_production:
        description: Confirm production deploy
        required: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.confirm_production }}
    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run remote deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "export REPO_DIR='${DEPLOY_REPO_DIR:-\$HOME/pil}'; bash -s -- '${{ inputs.ref }}'" \
            < scripts/deploy/remote-deploy.sh
